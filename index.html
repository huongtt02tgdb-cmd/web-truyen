<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Web Truyện — Viết & Lưu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;700&family=Noto+Serif:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root{--bg:#f7f3ec;--paper:#fffdf8;--ink:#2b2620;--muted:#8a7f6d;--line:#e5dcc9;--accent:#9a3b26;--accent2:#f3e9d7}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',Roboto,'Noto Sans',Arial,sans-serif}
  header{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);padding:14px 16px;z-index:5}
  .wrap{max-width:860px;margin:0 auto;padding:0 16px 60px}
  h1{font-size:24px;margin:0;cursor:pointer}
  .sub{color:var(--muted);font-size:14px;margin-top:4px}
  .bar{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}
  input[type=text],input[type=search],textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);font-family:inherit;font-size:16px}
  textarea{min-height:55vh;line-height:1.8;resize:vertical;font-family:'Noto Serif','Be Vietnam Pro',Georgia,serif}
  button{padding:10px 16px;border:1px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);font-family:inherit;font-size:15px;cursor:pointer}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  button.danger{color:#b3261e}
  .card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:16px;margin:10px 0;cursor:pointer}
  .card:hover{border-color:var(--accent)}
  .card h3{margin:0 0 6px;font-size:19px}
  .meta{color:var(--muted);font-size:13px}
  .stats{display:flex;gap:16px;flex-wrap:wrap;color:var(--muted);font-size:14px;margin:10px 0}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .grow{flex:1}
  .hidden{display:none}
  #saveStatus{color:var(--muted);font-size:13px}
  .empty{text-align:center;color:var(--muted);padding:40px 0}
</style>
</head>
<body>
<header><div class="wrap" style="padding-bottom:0">
  <h1 id="homeBtn">📖 Web Truyện</h1>
  <div class="sub" id="crumb">Viết truyện — mỗi truyện có nhiều chương, tự lưu trên máy này</div>
</div></header>

<div class="wrap">
  <!-- HOME: danh sách truyện -->
  <section id="viewHome">
    <div class="stats" id="homeStats"></div>
    <div class="bar">
      <input type="search" id="searchStory" class="grow" placeholder="Tìm truyện...">
      <button class="primary" id="btnNewStory">+ Truyện mới</button>
      <button id="btnExportAll">Xuất bản sao</button>
      <button id="btnImport">Nhập bản sao</button>
      <input type="file" id="fileImport" accept=".json" class="hidden">
    </div>
    <div id="storyList"></div>
  </section>

  <!-- STORY: danh sách chương -->
  <section id="viewStory" class="hidden">
    <div class="bar"><button id="btnBackHome">← Tất cả truyện</button></div>
    <input type="text" id="storyTitleInput" placeholder="Tên truyện (để trống cũng được, điền sau)" style="font-size:20px;font-weight:bold;margin:6px 0">
    <div class="stats" id="storyStats"></div>
    <div class="bar">
      <input type="search" id="searchChapter" class="grow" placeholder="Tìm chương theo tiêu đề / nội dung...">
      <button class="primary" id="btnNewChapter">+ Chương mới</button>
      <button id="btnExportStory">Tải truyện (.txt)</button>
      <button class="danger" id="btnDeleteStory">Xóa truyện</button>
    </div>
    <div id="chapterList"></div>
  </section>

  <!-- EDITOR: viết chương -->
  <section id="viewEdit" class="hidden">
    <div class="bar">
      <button id="btnBackStory">← Danh sách chương</button>
      <span id="saveStatus" class="grow"></span>
      <button id="btnDownloadChapter">Tải chương (.txt)</button>
      <button class="danger" id="btnDeleteChapter">Xóa chương</button>
    </div>
    <input type="text" id="chapterTitle" placeholder="Tiêu đề chương, ví dụ: Chương 1 — Vạn Thọ Yến">
    <div class="stats" id="editStats"></div>
    <textarea id="chapterBody" placeholder="Viết ở đây... gõ đến đâu tự lưu đến đó."></textarea>
  </section>
</div>

<script>
const KEY = 'web-truyen-v1';
let data = load();
let curStory = null, curChapter = null, saveTimer = null;

function nfc(s){ return (typeof s === 'string') ? s.normalize('NFC') : s; }
function load(){ try{ const d = JSON.parse(localStorage.getItem(KEY)) || [];
  // Ghép dấu tiếng Việt về dạng chuẩn (NFC): chữa chữ đã lưu bị tách dấu (ấ -> â + ´)
  d.forEach(s=>{ s.title = nfc(s.title||''); (s.chapters||[]).forEach(c=>{ c.title = nfc(c.title||''); c.content = nfc(c.content||''); }); });
  return d; }catch(e){ return []; } }
function save(){ localStorage.setItem(KEY, JSON.stringify(data)); }
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function words(t){ t=(t||'').trim(); return t ? t.split(/\s+/).length : 0; }
function esc(s){ return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtDate(ts){ return new Date(ts).toLocaleString('vi-VN'); }
function storyWords(s){ return s.chapters.reduce((a,c)=>a+words(c.content),0); }
function sTitle(s){ return (s.title && s.title.trim()) ? s.title : 'Truyện chưa đặt tên'; }
function chapNum(t){ const m = (t||'').match(/\d+/); return m ? parseInt(m[0],10) : Number.MAX_SAFE_INTEGER; }
function sortedChapters(s){ return s.chapters.map((c,i)=>({c,i}))
  .sort((a,b)=> (chapNum(a.c.title)-chapNum(b.c.title)) || (a.i-b.i)); }
function show(id){ ['viewHome','viewStory','viewEdit'].forEach(v=>document.getElementById(v).classList.toggle('hidden', v!==id)); }

/* ---------- HOME ---------- */
function renderHome(){
  show('viewHome');
  document.getElementById('crumb').textContent = 'Viết truyện — mỗi truyện có nhiều chương, tự lưu trên máy này';
  const q = document.getElementById('searchStory').value.trim().toLowerCase();
  const totalW = data.reduce((a,s)=>a+storyWords(s),0);
  const totalC = data.reduce((a,s)=>a+s.chapters.length,0);
  document.getElementById('homeStats').innerHTML =
    `<span><b>${data.length}</b> truyện</span><span><b>${totalC}</b> chương</span><span><b>${totalW.toLocaleString('vi-VN')}</b> chữ</span>`;
  const list = data.filter(s=>!q || (s.title||'').toLowerCase().includes(q))
    .sort((a,b)=>b.updated-a.updated);
  document.getElementById('storyList').innerHTML = list.length ? list.map(s=>
    `<div class="card" onclick="openStory('${s.id}')">
       <h3>${esc(sTitle(s))}</h3>
       <div class="meta">${s.chapters.length} chương · ${storyWords(s).toLocaleString('vi-VN')} chữ · sửa ${fmtDate(s.updated)}</div>
     </div>`).join('')
    : `<div class="empty">Chưa có truyện nào khớp. Bấm “+ Truyện mới” để bắt đầu.</div>`;
}
document.getElementById('searchStory').addEventListener('input', renderHome);
document.getElementById('btnNewStory').onclick = () => {
  // Không bắt điền gì hết: tạo truyện trống + Chương 1 rồi mở thẳng ô viết.
  const c = {id:uid(), title:'Chương 1', content:'', updated:Date.now()};
  const s = {id:uid(), title:'', created:Date.now(), updated:Date.now(), chapters:[c]};
  data.push(s); save(); curStory = s; openChapter(c.id);
};
document.getElementById('homeBtn').onclick = renderHome;
document.getElementById('btnExportAll').onclick = () => download('web-truyen-backup.json', JSON.stringify(data,null,2), 'application/json');
document.getElementById('btnImport').onclick = () => document.getElementById('fileImport').click();
document.getElementById('fileImport').addEventListener('change', e => {
  const f = e.target.files[0]; if(!f) return;
  f.text().then(t => { try{ const d = JSON.parse(t); if(!Array.isArray(d)) throw 0;
    if(confirm('Nhập bản sao sẽ THAY toàn bộ dữ liệu hiện tại. Tiếp tục?')){ data = d; save(); renderHome(); }
  }catch(_){ alert('File không hợp lệ.'); } });
});

/* ---------- STORY ---------- */
function openStory(id){
  curStory = data.find(s=>s.id===id); if(!curStory) return renderHome();
  show('viewStory');
  document.getElementById('crumb').textContent = 'Truyện: ' + sTitle(curStory);
  document.getElementById('storyTitleInput').value = curStory.title || '';
  renderChapters();
}
function renderChapters(){
  const q = document.getElementById('searchChapter').value.trim().toLowerCase();
  document.getElementById('storyStats').innerHTML =
    `<span><b>${curStory.chapters.length}</b> chương</span><span><b>${storyWords(curStory).toLocaleString('vi-VN')}</b> chữ</span>`;
  const list = sortedChapters(curStory)
    .filter(({c})=>!q || c.title.toLowerCase().includes(q) || (c.content||'').toLowerCase().includes(q));
  document.getElementById('chapterList').innerHTML = list.length ? list.map(({c,i})=>
    `<div class="card" onclick="openChapter('${c.id}')">
       <h3>${esc(c.title) || 'Chương ' + (i+1)}</h3>
       <div class="meta">${words(c.content).toLocaleString('vi-VN')} chữ · sửa ${fmtDate(c.updated)}</div>
     </div>`).join('')
    : `<div class="empty">Chưa có chương nào. Bấm “+ Chương mới” để viết chương đầu tiên.</div>`;
}
document.getElementById('searchChapter').addEventListener('input', renderChapters);
document.getElementById('btnBackHome').onclick = renderHome;
document.getElementById('btnNewChapter').onclick = () => {
  const n = curStory.chapters.length + 1;
  const c = {id:uid(), title:'Chương ' + n, content:'', updated:Date.now()};
  curStory.chapters.push(c); curStory.updated = Date.now(); save(); openChapter(c.id);
};
document.getElementById('storyTitleInput').addEventListener('input', e => {
  curStory.title = nfc(e.target.value); curStory.updated = Date.now(); save();
  document.getElementById('crumb').textContent = 'Truyện: ' + sTitle(curStory);
});
document.getElementById('btnDeleteStory').onclick = () => {
  if(!confirm('Xóa hẳn truyện “' + sTitle(curStory) + '” và mọi chương trong đó?')) return;
  data = data.filter(s=>s.id!==curStory.id); curStory = null; save(); renderHome();
};
document.getElementById('btnExportStory').onclick = () => {
  const txt = sTitle(curStory) + '\n\n' + sortedChapters(curStory).map(({c})=>c.title + '\n\n' + (c.content||'')).join('\n\n---\n\n');
  download(sTitle(curStory) + '.txt', txt, 'text/plain');
};

/* ---------- EDITOR ---------- */
function openChapter(id){
  curChapter = curStory.chapters.find(c=>c.id===id); if(!curChapter) return;
  show('viewEdit');
  document.getElementById('crumb').textContent = sTitle(curStory) + ' › ' + (curChapter.title || 'Chương');
  document.getElementById('chapterTitle').value = curChapter.title || '';
  document.getElementById('chapterBody').value = curChapter.content || '';
  document.getElementById('saveStatus').textContent = 'Đã lưu · ' + fmtDate(curChapter.updated);
  renderEditStats();
}
function renderEditStats(){
  const t = document.getElementById('chapterBody').value;
  const w = words(t);
  document.getElementById('editStats').innerHTML =
    `<span><b>${w.toLocaleString('vi-VN')}</b> chữ</span><span><b>${t.length.toLocaleString('vi-VN')}</b> ký tự</span><span>đọc khoảng <b>${Math.max(1, Math.ceil(w/200))}</b> phút</span>`;
}
function queueSave(){
  document.getElementById('saveStatus').textContent = 'Đang lưu...';
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    curChapter.title = nfc(document.getElementById('chapterTitle').value);
    curChapter.content = nfc(document.getElementById('chapterBody').value);
    curChapter.updated = Date.now(); curStory.updated = Date.now(); save();
    document.getElementById('saveStatus').textContent = 'Đã lưu · ' + fmtDate(curChapter.updated);
    renderEditStats();
  }, 400);
}
document.getElementById('chapterTitle').addEventListener('input', queueSave);
document.getElementById('chapterBody').addEventListener('input', () => { queueSave(); renderEditStats(); });
document.getElementById('btnBackStory').onclick = () => { clearTimeout(saveTimer);
  curChapter.title = nfc(document.getElementById('chapterTitle').value);
  curChapter.content = nfc(document.getElementById('chapterBody').value);
  curChapter.updated = Date.now(); curStory.updated = Date.now(); save(); openStory(curStory.id); };
document.getElementById('btnDownloadChapter').onclick = () =>
  download((curChapter.title || 'chuong') + '.txt', (curChapter.title||'') + '\n\n' + document.getElementById('chapterBody').value, 'text/plain');
document.getElementById('btnDeleteChapter').onclick = () => {
  if(!confirm('Xóa hẳn chương này?')) return;
  curStory.chapters = curStory.chapters.filter(c=>c.id!==curChapter.id);
  curStory.updated = Date.now(); save(); openStory(curStory.id);
};

function download(name, content, type){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([content], {type:type + ';charset=utf-8'}));
  a.download = name; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
}
window.openStory = openStory; window.openChapter = openChapter;

/* ---------- Nạp dữ liệu đã đẩy lên GitHub (data.json cùng thư mục) ----------
   Mở web ở máy/trình duyệt nào cũng tự thấy dữ liệu này.
   Gộp theo id, không ghi đè mất bài: truyện/chương nào máy chưa có thì thêm vào,
   trùng nhau thì giữ bản sửa mới hơn (theo thời gian updated). */
function mergeRemote(remote){
  let changed = false;
  remote.forEach(rs => {
    if(!rs || !rs.id || !Array.isArray(rs.chapters)) return;
    rs.title = nfc(rs.title||'');
    rs.chapters.forEach(rc => { rc.title = nfc(rc.title||''); rc.content = nfc(rc.content||''); });
    const ls = data.find(s=>s.id===rs.id);
    if(!ls){ data.push(rs); changed = true; return; }
    if((rs.updated||0) > (ls.updated||0) && rs.title !== ls.title){ ls.title = rs.title; changed = true; }
    rs.chapters.forEach(rc => {
      if(!rc || !rc.id) return;
      const lc = ls.chapters.find(c=>c.id===rc.id);
      if(!lc){ ls.chapters.push(rc); changed = true; }
      else if((rc.updated||0) > (lc.updated||0) && (rc.content !== lc.content || rc.title !== lc.title)){
        lc.title = rc.title; lc.content = rc.content; lc.updated = rc.updated; changed = true;
      }
    });
    if((rs.updated||0) > (ls.updated||0)){ ls.updated = rs.updated; }
  });
  return changed;
}
async function syncFromRepo(){
  try{
    const r = await fetch('data.json?t=' + Date.now(), {cache:'no-store'});
    if(!r.ok) return;
    const remote = await r.json();
    if(Array.isArray(remote) && mergeRemote(remote)){ save(); renderHome(); }
  }catch(e){ /* chưa có data.json hoặc mất mạng: dùng dữ liệu máy như cũ */ }
}
renderHome();
syncFromRepo();
</script>
</body>
</html>
