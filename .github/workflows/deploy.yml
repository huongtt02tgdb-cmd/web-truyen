name: deploy

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'site-worker/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare site files
        run: |
          mkdir -p site-worker/public
          cp index.html site-worker/public/

      - name: Deploy to Cloudflare Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: site-worker
          command: deploy
          wranglerVersion: "4"

      - name: Set site password secret
        run: echo "$SITE_PASSWORD" | npx -y wrangler secret put SITE_PASSWORD
        working-directory: site-worker
        env:
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
